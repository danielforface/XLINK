name: Refresh v6 locked dependency graph
on:
  push:
    branches: ["feature/support-workspace-v6"]
    paths: ["Cargo.toml", ".github/workflows/refresh-v6-lock.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve current pinned graph
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit new Cargo.lock
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock v6 WASAPI audio dependency graph"
          git push origin HEAD:feature/support-workspace-v6
