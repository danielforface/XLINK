name: Refresh Cargo lockfile for numeric pairing
on:
  push:
    branches: ["feature/public-numeric-pairing-v5"]
    paths: ["Cargo.toml", ".github/workflows/refresh-pairing-lock.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve public pairing dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit lockfile generated by Cargo
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock public mailbox pairing dependency graph"
          git push origin HEAD:feature/public-numeric-pairing-v5
